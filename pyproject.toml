[project]
name = "collective.blicca.footerblocks"
version = "1.0.0a1"
description = "Blicca rendering of editable footer blocks (collective.volto.footer) in a pagelet chrome"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
authors = [
    {name = "Maik Derstappen", email = "md@derico.de"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: Addon",
    "Framework :: Plone :: 6.0",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["Plone", "CMS"]

dependencies = [
    "Plone>=6.0",
    "collective.volto.footer",
    "plone.blicca.auroraeditor>=1.0.0a2",
    "plone.pageletlayout",
    "setuptools<81",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-plone>=0.5.0",
    "plone.app.testing",
    "plone.testing",
]

[project.urls]
Homepage = "https://github.com/collective/collective.blicca.footerblocks"
Documentation = "https://github.com/collective/collective.blicca.footerblocks"
Repository = "https://github.com/collective/collective.blicca.footerblocks.git"
Issues = "https://github.com/collective/collective.blicca.footerblocks/issues"

[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collective"]

[tool.plone.backend_addon.settings]
package_name = "collective.blicca.footerblocks"
package_title = "Collective Blicca Footerblocks"
package_description = "Blicca rendering of editable footer blocks (collective.volto.footer) in a pagelet chrome"
package_folder = "collective/blicca/footerblocks"
plone_version = "6.0"
is_headless = false
author_name = "Maik Derstappen"
author_email = "md@derico.de"

[tool.plone.backend_addon.settings.subtemplates]
content_types = []
behaviors = []
services = []

[tool.pytest.ini_options]
testpaths = ["src/collective/blicca/footerblocks/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["collective.blicca.footerblocks"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "C90",  # mccabe complexity
    "B",    # bugbear
    "S",    # bandit (security)
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PGH",  # pygrep-hooks
]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/**/tests/**" = ["S101"]
# Locale update helper shells out to fixed translation tools (i18ndude/msginit).
"src/**/locales/update.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
# Match the single-import-per-line, alphabetical layout the templates emit.
force-single-line = true
order-by-type = false
lines-after-imports = 2
known-first-party = ["collective"]

[tool.ruff.format]
preview = true
